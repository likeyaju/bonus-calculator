<header><div class="brand"><span class="brand-icon" aria-hidden="true">▦</span><strong data-t="title"></strong></div><div class="tools"><div class="lang-wrap"><button id="langButton" aria-expanded="false">🇨🇳 ▾</button><div id="langMenu" class="lang-menu" hidden></div></div><button id="settingsButton" data-t="settings"></button></div></header>
<main>
<section id="calculator"><div class="intro"><p class="eyebrow" data-t="factory"></p><h1 data-t="title"></h1><p data-t="subtitle"></p></div>
<div class="workspace"><section class="panel inputs"><div class="section-head"><h2 data-t="inputs"></h2><button id="reset" class="text-button" data-t="reset"></button></div>
<div class="fields">
<label><span data-t="sam"></span><small data-t="samUnit"></small><input id="sam" inputmode="decimal" enterkeyhint="next" autocomplete="off" spellcheck="false" aria-describedby="inputError"></label>
<label><span data-t="people"></span><small data-t="peopleUnit"></small><input id="people" inputmode="decimal" enterkeyhint="next" autocomplete="off" spellcheck="false" aria-describedby="inputError"></label>
<label><span data-t="hours"></span><small data-t="hoursUnit"></small><input id="hours" inputmode="decimal" enterkeyhint="next" autocomplete="off" spellcheck="false" aria-describedby="inputError"></label>
<label><span data-t="target"></span><small data-t="targetUnit"></small><input id="target" inputmode="decimal" enterkeyhint="done" autocomplete="off" spellcheck="false" aria-describedby="inputError"></label>
</div><p id="inputError" class="error" role="status" hidden></p>
<fieldset><legend data-t="days"></legend><div id="days" class="day-options"></div></fieldset>
<div id="schemeBadge" class="scheme-badge"></div><details><summary data-t="formula"></summary><p data-t="formulaText"></p><p data-t="timeNote"></p></details>
</section>
<section class="result-panel"><div class="section-head"><div><h2 data-t="results"></h2><p class="muted" data-t="resultHint"></p></div></div><div id="configStatus" class="config-status" role="status"></div><p id="priority" class="notice" data-t="priority"></p><div id="results" aria-live="polite"></div><p class="footnote" data-t="note"></p></section></div>
</section>
<section id="settings" hidden><button id="back" class="text-button" data-t="back"></button><h1 data-t="settings"></h1><section class="panel"><h2 data-t="language"></h2><div id="settingsLang" class="language-options"></div><label class="toggle"><span><strong data-t="colors"></strong><small data-t="colorsHint"></small></span><input id="colors" type="checkbox" checked></label></section>
<section class="panel"><h2 data-t="config"></h2><p id="configMeta"></p><p data-t="configHelp"></p><div class="actions"><button id="download" data-t="download"></button><label class="button primary"><span data-t="upload"></span><input id="upload" type="file" accept=".xlsx" hidden></label></div><p id="importError" class="error" role="alert" hidden></p><div id="preview" hidden><h3 data-t="preview"></h3><div id="previewMeta"></div><div id="previewData" class="preview-data"></div><div class="actions"><button id="apply" class="primary" data-t="apply"></button><button id="cancel" data-t="cancel"></button></div></div><p class="notice" data-t="publishHelp"></p><div class="actions"><button id="restore" data-t="restore"></button><button id="reload" data-t="reload"></button><button id="exportOffline" data-t="exportOffline"></button></div></section><p class="footnote" data-t="storage"></p></section>

function today(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function metadata(c){return text('version')+': '+c.version+' · '+text('effective')+': '+c.effective+' · '+c.currency;}
function range(r){return(r.li?'≥':'>')+r.lo+'%'+(r.hi!==''?' – '+(r.ui?'≤':'<')+r.hi+'%':'');}
function groupBounds(r){return(r.slo===''?'':(r.sli?'≥':'>')+r.slo)+(r.shi===''?'':(r.sui?' ≤':' <')+r.shi);}
function render(){
 document.documentElement.lang=language==='both'?'km':language==='zh'?'zh-CN':language;document.title=text('title');
 document.querySelectorAll('[data-t]').forEach(x=>tr(x,x.dataset.t));
 $('langButton').textContent=(language==='zh'?'🇨🇳':language==='en'?'🇬🇧':language==='both'?'🇰🇭 🇨🇳':'🇰🇭')+' ▾';$('langButton').setAttribute('aria-label',text('language'));
 languageButtons($('langMenu'));languageButtons($('settingsLang'));
 $('days').replaceChildren();for(let i=1;i<=4;i++){const b=label('day'+i,'button',day===i?'active':'');b.setAttribute('aria-pressed',String(day===i));b.onclick=()=>{day=i;render();};$('days').append(b);}
 $('priority').hidden=day===4;$('reload').hidden=mode==='offline'||location.protocol==='file:';
 $('configMeta').textContent=metadata(config);$('configStatus').replaceChildren(label(status));if(ready){const m=el('span');m.textContent=' · '+metadata(config);$('configStatus').append(m);}
 $('configStatus').classList.toggle('error',!ready&&status!=='loading');$('download').disabled=!ready;$('exportOffline').disabled=!ready;
 $('inputError').hidden=!inputError;if(inputError)tr($('inputError'),inputError);
 renderResults();if(pending)renderPreview();
}
function renderResults(){
 const box=$('results');box.replaceChildren();const all=ids.every(id=>{try{return cmp(rat($(id).value),rat('0'))>0;}catch{return false;}});
 $('schemeBadge').replaceChildren();
 if($('sam').value){try{const r=selectRows(config.normal,$('sam').value,4)[0];if(r)$('schemeBadge').textContent=text('normal')+' · SAM '+groupBounds(r);}catch{}}
 if(!ready||!all){box.append(label(ready?'empty':status,'div','empty'));return;}
 const normal=selectRows(config.normal,$('sam').value,4),special=selectRows(config.special,$('sam').value,day);
 if(day<4)box.append(resultGroup(special,'supplement',normal[0]));box.append(resultGroup(normal,'normal'));
}
function resultGroup(rows,kind,normalFirst){
 const section=el('section','result-group '+kind),head=el('div','group-header');head.append(label(kind,'h3'));if(kind==='normal'&&day<4)head.append(label('normalHint','small'));section.append(head);
 const th=el('div','table-head');th.append(label('bonus'),label('output'),label('attainment'));section.append(th);
 for(const r of rows){
  const row=el('div','tier'),money=el('div'),output=el('div'),rates=el('div');
  const amount=el('strong');amount.textContent=Number(r.bonus).toLocaleString('en-US');money.append(amount,label('moneyUnit','small'));
  const value=el('strong','output-value');
  try{const n=hourly($('sam').value,$('people').value,$('target').value,r.lo);if(n.length>12)throw Error('limit');value.textContent=BigInt(n).toLocaleString('en-US');}catch{value.textContent='—';output.append(label('limit','small'));}
  output.prepend(value);output.append(label('pieceUnit','small'));
  const interval=el('div','range');interval.textContent=range(r);rates.append(interval);const eff=el('div','eff');eff.append(label('actual'));const ev=el('span');ev.textContent=' '+displayEfficiency($('target').value,r.lo)+'%';eff.append(ev);rates.append(eff);
  if(kind==='supplement'&&r.hi===''&&normalFirst){interval.textContent=range(r)+' – <'+normalFirst.lo+'%';rates.append(label('untilNormal','small'));}
  row.append(money,output,rates);section.append(row);
 }return section;
}
function renderPreview(){
 $('preview').hidden=false;$('previewMeta').textContent=metadata(pending.config);$('previewData').replaceChildren();
 for(const[k,key]of[['normal','normal'],['special','supplement']]){
  $('previewData').append(label(key,'h3'));for(const r of pending.config[k]){
   const p=el('div','preview-row');p.textContent='SAM '+groupBounds(r)+' · '+text('day'+r.day)+' · '+range(r)+' · '+Number(r.bonus).toLocaleString('en-US')+' KHR';$('previewData').append(p);
  }
 }
}
const encode=buffer=>{let s='';const a=new Uint8Array(buffer);for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode(...a.subarray(i,i+8192));return btoa(s);};
const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function download(data,type,name){const url=URL.createObjectURL(new Blob([data],{type})),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function activate(c,bytes,origin){config=validate(c);currentBytes=bytes;source=origin;ready=c.effective<=today();status=ready?origin:'future';render();}
async function loadOnline(){
 ready=false;status='loading';render();const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
 try{const url=new URL('bonus-config.xlsx',location.href);url.searchParams.set('v',Date.now());const response=await fetch(url,{cache:'no-store',signal:controller.signal});if(!response.ok)throw Error('fetch');const b=await response.arrayBuffer();if(b.byteLength>2e6)throw Error('size');const c=configFromSheets(readXlsx(b));activate(c,encode(b),'online');}
 catch(error){console.error('Configuration load failed:',error.message);ready=false;status='failed';render();}finally{clearTimeout(timer);}
}
function offlineExport(){
 const doc=document.documentElement.cloneNode(true);
 doc.querySelector('#bundled-xlsx').textContent=currentBytes;doc.querySelector('#mode').textContent='"offline"';
 doc.querySelector('#calculator').hidden=false;doc.querySelector('#settings').hidden=true;doc.querySelector('#preview').hidden=true;doc.querySelector('#importError').hidden=true;doc.querySelector('#upload').value='';
 for(const id of ids)doc.querySelector('#'+id).removeAttribute('value');
 download('<!doctype html>\n'+doc.outerHTML,'text/html;charset=utf-8','bonus-calculator-offline.html');
}
for(let i=0;i<ids.length;i++){
 const input=$(ids[i]);let firstPointer=false;
 input.addEventListener('focus',()=>{firstPointer=true;requestAnimationFrame(()=>input.select());});
 input.addEventListener('pointerup',e=>{if(firstPointer){e.preventDefault();input.select();firstPointer=false;}});
 input.addEventListener('input',()=>{
  const s=input.value;if(/^(?:\d+(?:[.,]\d*)?)?$/.test(s)&&s.length<=30){lastValid[input.id]=s;inputError='';input.removeAttribute('aria-invalid');}
  else{input.value=lastValid[input.id];inputError='invalid';}
  $('inputError').hidden=!inputError;if(inputError)tr($('inputError'),inputError);renderResults();
 });
 input.addEventListener('blur',()=>{firstPointer=false;if(input.value){input.value=input.value.replace(/[.,]$/,'');lastValid[input.id]=input.value;try{if(cmp(rat(input.value),rat('0'))<=0){inputError='positive';input.setAttribute('aria-invalid','true');}}catch{inputError='positive';} }$('inputError').hidden=!inputError;if(inputError)tr($('inputError'),inputError);renderResults();});
 input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(i<3)$(ids[i+1]).focus();else input.blur();}});
}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('input')&&document.activeElement?.matches('input'))document.activeElement.blur();if(!e.target.closest('.lang-wrap')){$('langMenu').hidden=true;$('langButton').setAttribute('aria-expanded','false');}});
$('langButton').onclick=()=>{$('langMenu').hidden=!$('langMenu').hidden;$('langButton').setAttribute('aria-expanded',String(!$('langMenu').hidden));};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('langMenu').hidden=true;$('langButton').setAttribute('aria-expanded','false');}});
$('settingsButton').onclick=()=>{$('calculator').hidden=true;$('settings').hidden=false;window.scrollTo(0,0);};
$('back').onclick=()=>{$('calculator').hidden=false;$('settings').hidden=true;window.scrollTo(0,0);};
$('reset').onclick=()=>{for(const id of ids){$(id).value='';lastValid[id]='';$(id).removeAttribute('aria-invalid');}day=1;inputError='';render();};
$('colors').checked=storage.get('colors')!=='off';document.body.classList.toggle('no-colors',!$('colors').checked);
$('colors').onchange=()=>{storage.set('colors',$('colors').checked?'on':'off');document.body.classList.toggle('no-colors',!$('colors').checked);};
$('upload').onchange=async()=>{
 const file=$('upload').files[0];if(!file)return;pending=null;$('preview').hidden=true;$('importError').hidden=true;
 try{if(file.size>2e6)throw Error('size');const bytes=await file.arrayBuffer(),c=configFromSheets(readXlsx(bytes));pending={config:c,bytes:encode(bytes)};renderPreview();}
 catch{$('importError').hidden=false;tr($('importError'),'importError');}$('upload').value='';
};
$('apply').onclick=()=>{if(!pending)return;storage.set(configStorageKey,pending.bytes);activate(pending.config,pending.bytes,'local');pending=null;$('preview').hidden=true;};
$('cancel').onclick=()=>{pending=null;$('preview').hidden=true;};
$('restore').onclick=()=>{storage.remove(configStorageKey);activate(bundled,bundledBytes,'offline');};
$('reload').onclick=()=>{storage.remove(configStorageKey);loadOnline();};
$('download').onclick=()=>download(decode(currentBytes),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','bonus-config.xlsx');
$('exportOffline').onclick=offlineExport;
async function init(){
 const local=storage.get(configStorageKey);if(local){try{activate(configFromSheets(readXlsx(decode(local).buffer)),local,'local');return;}catch{storage.remove(configStorageKey);}}
 if(mode==='offline'||location.protocol==='file:'){activate(bundled,bundledBytes,'offline');return;}
 await loadOnline();
}
render();init();



}</script></body></html>
